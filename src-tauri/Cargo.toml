[package]
name = "typeless-switch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small, local account switcher for Typeless"

[lib]
name = "typeless_switch"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "typeless-switch"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri?/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
fs2 = "0.4"
dirs = "6"
tempfile = "3"
sysinfo = "0.33"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
